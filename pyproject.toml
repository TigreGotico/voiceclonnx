[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceclonnx"
dynamic = ["version"]
description = "Pure-ONNX multi-engine voice-cloning library — no torch at runtime"
license = {text = "Apache-2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
authors = [{name = "JarbasAI", email = "jarbasai@mailfence.com"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "onnxruntime",
    "scipy",
    "soundfile",
    "huggingface_hub",
]

[project.optional-dependencies]
convert = [
    "torch",
    "onnx",
    "onnxruntime",
    "onnxruntime-tools",
    "huggingface_hub",
    # With no floor the resolver picks an ancient transformers: the convert extra
    # compiles to transformers 4.12.2 (2021) on the declared Python 3.9 floor,
    # because an old transformers declares no huggingface-hub dependency and so
    # lets huggingface-hub stay newest. The floor gives transformers 4.57.6 with
    # huggingface-hub 0.36.2 instead.
    "transformers>=4.44",
    "librosa",
]
bench = [
    "faster-whisper",
    "edge-tts",
]
test = [
    "pytest",
    "faster-whisper",
    "edge-tts",
]

[project.scripts]
voiceclonnx = "voiceclonnx.__main__:main"


[project.urls]
Homepage = "https://github.com/TigreGotico/voiceclonnx"

[tool.setuptools.dynamic]
version = {attr = "voiceclonnx.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"voiceclonnx" = ["**/*"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
no_site_packages = true
strict = false
warn_unused_ignores = true
warn_return_any = false

[tool.ruff]
line-length = 120
target-version = "py39"
