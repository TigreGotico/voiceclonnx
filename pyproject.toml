[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceclonnx"
dynamic = ["version"]
description = "Pure-ONNX multi-engine voice-cloning library — no torch at runtime"
license = {text = "Apache-2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
authors = [{name = "JarbasAI", email = "jarbasai@mailfence.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "onnxruntime>=1.32.0",
    "scipy",
    "soundfile",
    "huggingface_hub",
]

[project.optional-dependencies]
convert = [
    "torch",
    "onnx",
    "onnxruntime>=1.32.0",
    "onnxruntime-tools",
    "huggingface_hub",
    "transformers",
    "librosa",
]
bench = [
    "faster-whisper",
    "edge-tts",
]
test = [
    "pytest",
    "onnx",
    "setuptools>=68",
    "faster-whisper",
    "edge-tts",
]

[project.scripts]
voiceclonnx = "voiceclonnx.__main__:main"


[project.urls]
Homepage = "https://github.com/TigreGotico/voiceclonnx"

[tool.setuptools.dynamic]
version = {attr = "voiceclonnx.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
# Without an include, setuptools discovers every top-level package in the
# tree and the wheel installs conversion/, demo/, examples/ and tests/
# into site-packages. A top-level `tests` shadows the `tests` of any other
# distribution.
include = ["voiceclonnx*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_site_packages = true
strict = false
warn_unused_ignores = true
warn_return_any = false

[tool.ruff]
line-length = 120
target-version = "py311"
