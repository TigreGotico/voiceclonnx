[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceclonnx"
dynamic = ["version"]
description = "Pure-ONNX multi-engine voice-cloning library — no torch at runtime"
license = {text = "Apache-2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
authors = [{name = "JarbasAI", email = "jarbasai@mailfence.com"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "onnxruntime>=1.32.0",
    "scipy",
    "soundfile",
    "huggingface_hub",
]

[project.optional-dependencies]
convert = [
    "torch",
    "onnx",
    "onnxruntime>=1.32.0",
    "onnxruntime-tools",
    "huggingface_hub",
    # conversion/export_rvc.py passes attn_implementation to from_pretrained,
    # which transformers accepts from 4.36.0. Without a floor, an environment
    # that needs huggingface-hub>=1.0 and excludes transformers 5 resolves to
    # transformers 4.12.2, which has no WavLMModel for export_knnvc.
    "transformers>=4.36",
    "librosa",
]
bench = [
    "faster-whisper",
    "edge-tts",
    # faster-whisper accepts any tokenizers. When the newest tokenizers caps
    # huggingface-hub below the major the environment holds, the resolver
    # falls back to 0.13.3: it declares no huggingface-hub dependency, ships no
    # 3.12 or 3.13 wheel, and no longer compiles. 0.19.0 to 0.20.1 ship cp312
    # wheels but no cp313 wheels. From 0.20.2 on, every release installs on
    # 3.11, 3.12 and 3.13 from a wheel.
    "tokenizers>=0.20.2",
]
test = [
    "pytest",
    "onnx",
    "setuptools>=68",
    "faster-whisper",
    "edge-tts",
    "tokenizers>=0.20.2",  # see the note in [bench]
]

[project.scripts]
voiceclonnx = "voiceclonnx.__main__:main"


[project.urls]
Homepage = "https://github.com/TigreGotico/voiceclonnx"

[tool.setuptools.dynamic]
version = {attr = "voiceclonnx.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
# Without an include, setuptools discovers every top-level package in the
# tree and the wheel installs conversion/, demo/, examples/ and tests/
# into site-packages. A top-level `tests` shadows the `tests` of any other
# distribution.
include = ["voiceclonnx*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_site_packages = true
strict = false
warn_unused_ignores = true
warn_return_any = false

[tool.ruff]
line-length = 120
target-version = "py311"
