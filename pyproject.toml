[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voiceclonnx"
dynamic = ["version"]
description = "Pure-ONNX multi-engine voice-cloning library — no torch at runtime"
license = {text = "Apache-2.0"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
authors = [{name = "JarbasAI", email = "jarbasai@mailfence.com"}]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "onnxruntime",
    "scipy",
    "soundfile",
    "huggingface_hub",
]

[project.optional-dependencies]
convert = [
    "torch",
    "onnx",
    "onnxruntime",
    "onnxruntime-tools",
    "huggingface_hub",
    "transformers",
    "librosa",
]
bench = [
    "faster-whisper",
    "edge-tts",
    # faster-whisper accepts any tokenizers, so without a floor the resolver
    # is free to take one with no wheel for the interpreter. It took 0.13.3,
    # which publishes no wheel for 3.12 or 3.13 and no longer compiles:
    # "casting &T to &mut T is undefined behavior". 0.14.0 is the first
    # release with a 3.12 wheel and 0.15.1 the first with a 3.13 one, but
    # 0.19.0 through 0.20.1 ship neither; 0.20.2 is the first release from
    # which every later version carries a 3.13-capable wheel.
    "tokenizers>=0.20.2",
]
test = [
    "pytest",
    "faster-whisper",
    "edge-tts",
    "tokenizers>=0.20.2",  # see the note in [bench]
]

[project.scripts]
voiceclonnx = "voiceclonnx.__main__:main"


[project.urls]
Homepage = "https://github.com/TigreGotico/voiceclonnx"

[tool.setuptools.dynamic]
version = {attr = "voiceclonnx.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"voiceclonnx" = ["**/*"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
no_site_packages = true
strict = false
warn_unused_ignores = true
warn_return_any = false

[tool.ruff]
line-length = 120
target-version = "py39"
