name: Demo page (GitHub Pages)
on:
  push:
    branches: [master]
    paths: ['demo/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    # Set the repository variable ENABLE_DEMO_PAGES to 'true' after
    # Settings -> Pages -> Source is set to GitHub Actions. The repository
    # is public, but Pages is not configured yet, so this deploys nothing
    # until that switch is thrown.
    if: vars.ENABLE_DEMO_PAGES == 'true'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: demo }
      - id: deploy
        uses: actions/deploy-pages@v4
