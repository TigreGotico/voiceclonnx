name: Demo page (GitHub Pages)
on:
  push:
    branches: [master]
    paths: ['demo/**']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    # The deploy runs only when the repository variable ENABLE_DEMO_PAGES is
    # set to 'true'. Set it after Settings -> Pages -> Source is GitHub Actions.
    if: vars.ENABLE_DEMO_PAGES == 'true'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: demo }
      - id: deploy
        uses: actions/deploy-pages@v4
